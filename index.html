/* ==========================================================================
   M<>S Study Hub — Editorial Design System (css/style.css)
   Light: Warm Cream + Espresso + Muted Olive + Terracotta
   Dark: Deep Charcoal + Dark Coffee + Warm Off-White + Olive + Soft Amber
   Zero Blue, Zero Purple, Zero Neon.
   ========================================================================== */

:root {
  --bg: #F7F3EB;
  --surface: #FDFBF7;
  --surface-alt: #EFE9DD;
  --text: #261E18;
  --text-muted: #6A5E54;
  --olive: #556846;
  --olive-hover: #445437;
  --olive-soft: rgba(85, 104, 70, 0.11);
  --accent: #B45E43; /* Terracotta */
  --accent-soft: rgba(180, 94, 67, 0.12);
  --border: #DED6C8;

  --ok: #3F603B;
  --ok-bg: #E6F0E4;
  --err: #9B362A;
  --err-bg: #F7E7E4;
  --warn: #946824;
  --warn-bg: #F6EFE0;

  --font-en: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-serif: 'Source Serif 4', Georgia, serif;
  --font-ar: 'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --radius: 6px;
  --shadow: 0 1px 3px rgba(38, 30, 24, 0.06);
  --nav-h: 64px;
}

[data-theme="dark"] {
  --bg: #171614;
  --surface: #231F1C;
  --surface-alt: #2E2824;
  --text: #F5F0E6;
  --text-muted: #B8AEA0;
  --olive: #8EA37B;
  --olive-hover: #7A8F68;
  --olive-soft: rgba(142, 163, 123, 0.14);
  --accent: #D6A15C; /* Soft Amber */
  --accent-soft: rgba(214, 161, 92, 0.14);
  --border: #3A332D;

  --ok: #8FB88A;
  --ok-bg: rgba(63, 96, 59, 0.34);
  --err: #E69085;
  --err-bg: rgba(155, 54, 42, 0.30);
  --warn: #E2B770;
  --warn-bg: rgba(148, 104, 36, 0.28);

  --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
}

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; overflow-x: hidden; scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-en);
  line-height: 1.62;
  overflow-x: hidden;
  transition: background-color 0.2s ease, color 0.2s ease;
}
[dir="rtl"] body { font-family: var(--font-ar); }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg { max-width: 100%; height: auto; display: block; }

/* Typographic M<>S Logo */
.brand { display: inline-flex; align-items: center; gap: 9px; flex-shrink: 0; }
.brand-mark {
  display: inline-flex; align-items: center; gap: 1px;
  padding: 5px 10px; background-color: #556846; color: #FDFBF7;
  border-radius: 4px; font-family: var(--font-mono); font-size: 0.96rem;
  font-weight: 800; letter-spacing: 0.05em;
}
.brand-mark em { font-style: normal; color: #E2C6A6; }
.brand-name { font-size: 0.84rem; font-weight: 700; color: var(--text-muted); display: none; }

/* Header & Navigation */
.topbar {
  position: sticky; top: 0; z-index: 100; height: var(--nav-h);
  background-color: var(--surface); border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto; height: 100%; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.nav-links { display: none; align-items: center; gap: 4px; }
.nav-link {
  padding: 7px 12px; border-radius: 4px; font-size: 0.88rem; font-weight: 600;
  color: var(--text-muted); white-space: nowrap;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.nav-link:hover { background-color: var(--surface-alt); color: var(--text); }
.nav-link.active { background-color: #556846; color: #FDFBF7; }

.topbar-ctrls { display: flex; align-items: center; gap: 6px; }
.ctrl-btn {
  min-height: 36px; padding: 6px 10px; border-radius: 4px;
  background-color: var(--surface-alt); border: 1px solid var(--border);
  font-size: 0.82rem; font-weight: 700;
}
.ctrl-btn:hover { border-color: var(--accent); }

.mobile-drawer {
  display: none; background-color: var(--surface);
  border-bottom: 1px solid var(--border); padding: 12px 16px 16px;
}
.mobile-drawer.open { display: block; }
.mobile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.mobile-drawer .nav-link { display: block; border: 1px solid var(--border); padding: 10px 12px; }

/* Page Container & Headers */
.container { max-width: 1180px; margin: 0 auto; padding: 22px 16px 72px; width: 100%; }
.page-head { margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.eyebrow { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.page-title { margin: 4px 0 6px; font-family: var(--font-serif); font-size: 1.75rem; line-height: 1.24; }
[dir="rtl"] .page-title { font-family: var(--font-ar); }
.page-sub { margin: 0; font-size: 0.94rem; color: var(--text-muted); }

/* Distinct Editorial Surface Treatments */
.card { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.card-alt { background-color: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.callout-terracotta {
  background-color: var(--accent-soft);
  border: 1px solid var(--border);
  border-inline-start: 4px solid var(--accent);
  border-radius: 4px; padding: 14px 16px;
}

/* Buttons & Badges */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 40px; padding: 8px 16px; border-radius: 4px;
  font-size: 0.88rem; font-weight: 600; border: 1px solid transparent;
  white-space: nowrap; transition: background-color 0.15s ease, border-color 0.15s ease;
}
.btn-primary { background-color: #556846; color: #FDFBF7; border-color: #556846; }
.btn-primary:hover { background-color: #445437; }
.btn-accent { background-color: var(--accent); color: #FDFBF7; border-color: var(--accent); }
.btn-secondary { background-color: var(--surface); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background-color: var(--surface-alt); border-color: var(--olive); }
.btn-danger { background-color: var(--err); color: #FDFBF7; }
.btn-sm { min-height: 32px; padding: 5px 11px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 0.74rem; font-weight: 700; }
.badge-olive { background-color: var(--ok-bg); color: var(--ok); }
.badge-accent { background-color: var(--accent-soft); color: var(--accent); }
.badge-err { background-color: var(--err-bg); color: var(--err); }
.badge-muted { background-color: var(--surface-alt); color: var(--text-muted); border: 1px solid var(--border); }

.input, .select {
  width: 100%; min-height: 40px; padding: 8px 12px;
  background-color: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text);
}
.input:focus, .select:focus { outline: 2px solid var(--olive); outline-offset: 1px; }

/* Dashboard Hero + Ring Progress */
.dash-hero {
  background-color: var(--surface); border: 1px solid var(--border);
  border-inline-start: 4px solid var(--olive); border-radius: var(--radius);
  padding: 22px; margin-bottom: 18px;
  display: flex; flex-direction: column; gap: 18px;
}
.ring-wrap { display: flex; align-items: center; gap: 16px; }
.ring-svg { width: 82px; height: 82px; flex-shrink: 0; }
.ring-bg { fill: none; stroke: var(--surface-alt); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--olive); stroke-width: 8; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 0.5s ease; }

.stats-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-tile { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.stat-k { font-size: 0.73rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.stat-v { font-size: 1.5rem; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }

.grid-3 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }

.progress-track { width: 100%; height: 8px; background-color: var(--surface-alt); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background-color: var(--olive); transition: width 0.35s ease; }

/* Tabs & Interactive Controls */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tab {
  padding: 7px 12px; border-radius: 4px; background-color: var(--surface);
  border: 1px solid var(--border); font-size: 0.84rem; font-weight: 600; color: var(--text-muted);
}
.tab.active { background-color: #556846; color: #FDFBF7; border-color: #556846; }

/* Quiz Options & Feedback */
.opt-list { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
.opt-btn {
  display: flex; align-items: flex-start; gap: 10px; width: 100%;
  padding: 13px 14px; text-align: start; background-color: var(--surface-alt);
  border: 1px solid var(--border); border-radius: 4px; font-size: 0.93rem;
}
.opt-btn:hover:not(:disabled) { border-color: var(--olive); }
.opt-btn.ok { border-color: var(--ok); background-color: var(--ok-bg); font-weight: 700; }
.opt-btn.err { border-color: var(--err); background-color: var(--err-bg); }
.opt-key {
  min-width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4px; background-color: var(--surface); border: 1px solid var(--border);
  font-weight: 700; font-size: 0.8rem; flex-shrink: 0;
}

.fb-box { margin-top: 14px; padding: 13px 15px; border-radius: 4px; border: 1px solid var(--border); font-size: 0.9rem; }
.fb-box.ok { background-color: var(--ok-bg); border-color: var(--ok); }
.fb-box.err { background-color: var(--err-bg); border-color: var(--err); }

/* Immediate-Feedback Matching Grid */
.match-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
.match-btn {
  width: 100%; padding: 11px 12px; text-align: start; background-color: var(--surface-alt);
  border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; font-size: 0.9rem;
}
.match-btn.picking { border: 2px solid var(--accent); background-color: var(--accent-soft); }
.match-btn.ok { background-color: var(--ok-bg); border-color: var(--ok); }
.match-btn.err { background-color: var(--err-bg); border-color: var(--err); }

/* Flashcard + Spaced Repetition Ratings */
.fc-card {
  max-width: 680px; margin: 0 auto 16px; min-height: 230px;
  background-color: var(--surface); border: 1px solid var(--border);
  border-top: 4px solid var(--accent); border-radius: var(--radius);
  padding: 26px 22px; display: flex; flex-direction: column;
  justify-content: center; gap: 10px; cursor: pointer;
}
.srs-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-width: 680px; margin: 0 auto; }

/* Modal, Toast, Empty */
.modal-bg { position: fixed; inset: 0; background: rgba(23, 22, 20, 0.58); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 200; }
.modal-bg.open { display: flex; }
.modal-box { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); max-width: 440px; width: 100%; padding: 22px; }
.toast {
  position: fixed; bottom: 20px; inset-inline-end: 20px; z-index: 300;
  background-color: #261E18; color: #FDFBF7; padding: 10px 16px; border-radius: 4px;
  border-inline-start: 4px solid var(--accent); font-size: 0.86rem; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
}
.toast.show { opacity: 1; }
.empty-box { text-align: center; padding: 26px 16px; background-color: var(--surface-alt); border: 1px dashed var(--border); border-radius: var(--radius); color: var(--text-muted); }

.spa-view { display: none; }
.spa-view.active { display: block; }

/* ==========================================================================
   M<>S Study Hub — Responsive Breakpoints (css/responsive.css)
   ========================================================================== */

@media (min-width: 640px) {
  .brand-name { display: inline; }
  .match-grid { grid-template-columns: 1fr 1fr; }
  .srs-row { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 768px) {
  .container { padding: 28px 24px 76px; }
  .page-title { font-size: 2rem; }
  .dash-hero { flex-direction: row; align-items: center; justify-content: space-between; padding: 26px; }
  .stats-strip { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 1024px) {
  .nav-links { display: flex; }
  .mobile-menu-btn, .mobile-drawer { display: none !important; }
  .stats-strip { grid-template-columns: repeat(6, 1fr); }
}

@media (max-width: 390px) {
  .topbar-inner { padding: 0 10px; gap: 6px; }
  .ctrl-btn { padding: 5px 8px; font-size: 0.76rem; }
  .mobile-grid { grid-template-columns: 1fr; }
  .card { padding: 15px; }
}

/* ==========================================================================
   M<>S Study Hub — Subtle Purposeful Animations (css/animations.css)
   Respects prefers-reduced-motion.
   ========================================================================== */

@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.spa-view.active, .card {
  animation: fadeSlide 0.22s ease;
}

.fc-card {
  transition: transform 0.18s ease, border-color 0.2s ease;
}

.fc-card:hover {
  transform: translateY(-2px);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition-duration: 0.01ms !important;
  }
}

/* ==========================================================================
   M<>S Study Hub — LocalStorage + JSON Export/Import (js/storage.js)
   ========================================================================== */

window.MSHUB_STORAGE = (function () {
  var KEY = 'ms_study_hub_v1';
  var mem = null;

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function defaults() {
    return {
      lang: 'en',
      theme: 'light',
      lastTopic: 'topic1',
      completedTopics: [],
      bookmarks: [],
      questionStats: {},   /* qId -> { attempts, correct, wrong } */
      mistakes: {},        /* qId -> { wrongCount, lastWrong, mastered } */
      srs: {},             /* qId -> { rating, intervalMin, nextReviewAt, reps } */
      quizHistory: [],
      streak: 0,
      lastDate: ''
    };
  }

  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return defaults();
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return defaults();
      return Object.assign(defaults(), parsed);
    } catch (e) {
      return mem ? Object.assign(defaults(), mem) : defaults();
    }
  }

  function save(st) {
    mem = st;
    try { window.localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
  }

  function touchStreak(st) {
    var t = today();
    if (st.lastDate === t) return;
    if (st.lastDate) {
      var diff = Math.round((new Date(t + 'T00:00:00') - new Date(st.lastDate + 'T00:00:00')) / 86400000);
      st.streak = diff === 1 ? (st.streak || 0) + 1 : 1;
    } else st.streak = 1;
    st.lastDate = t;
  }

  function update(fn) {
    var st = load();
    fn(st);
    save(st);
    return st;
  }

  function recordAnswer(qId, isCorrect, chosenText) {
    return update(function (st) {
      touchStreak(st);
      var qs = st.questionStats[qId] || { attempts: 0, correct: 0, wrong: 0 };
      qs.attempts += 1;
      if (isCorrect) {
        qs.correct += 1;
      } else {
        qs.wrong += 1;
        var m = st.mistakes[qId] || { wrongCount: 0, lastWrong: '', mastered: false };
        m.wrongCount += 1;
        m.lastWrong = String(chosenText || '—');
        m.mastered = false;
        st.mistakes[qId] = m;
      }
      st.questionStats[qId] = qs;
    });
  }

  function exportJson() {
    return JSON.stringify(load(), null, 2);
  }

  function importJson(jsonStr) {
    try {
      var parsed = JSON.parse(jsonStr);
      if (!parsed || typeof parsed !== 'object' || !('questionStats' in parsed)) {
        return { ok: false, error: 'Invalid M<>S Study Hub backup file.' };
      }
      var merged = Object.assign(defaults(), parsed);
      save(merged);
      return { ok: true, state: merged };
    } catch (e) {
      return { ok: false, error: 'Corrupted or invalid JSON.' };
    }
  }

  function resetAll() {
    var d = defaults();
    save(d);
    return d;
  }

  return {
    KEY: KEY, load: load, save: save, update: update, touchStreak: touchStreak,
    recordAnswer: recordAnswer, exportJson: exportJson, importJson: importJson, resetAll: resetAll
  };
})();

/* ==========================================================================
   M<>S Study Hub — Local Spaced Repetition Engine (js/spaced-repetition.js)
   Categories: Again (1 min), Hard (10 min), Good (1 day), Easy (4 days)
   ========================================================================== */

window.MSHUB_SRS = (function () {
  var INTERVALS_MIN = {
    again: 1,
    hard: 10,
    good: 1440,   /* 1 day */
    easy: 5760    /* 4 days */
  };

  function rate(qId, rating) {
    var baseMin = INTERVALS_MIN[rating] || 10;
    return window.MSHUB_STORAGE.update(function (st) {
      window.MSHUB_STORAGE.touchStreak(st);
      var prev = st.srs[qId] || { reps: 0, intervalMin: 0 };
      var nextMin = baseMin;
      if (rating === 'good' && prev.reps >= 1) nextMin = Math.round(Math.max(baseMin, prev.intervalMin * 1.8));
      if (rating === 'easy' && prev.reps >= 1) nextMin = Math.round(Math.max(baseMin, prev.intervalMin * 2.5));
      st.srs[qId] = {
        rating: rating,
        reps: rating === 'again' ? 0 : prev.reps + 1,
        intervalMin: nextMin,
        lastReviewedAt: Date.now(),
        nextReviewAt: Date.now() + nextMin * 60000
      };
    });
  }

  function getOrderedQueue(questions) {
    var st = window.MSHUB_STORAGE.load();
    var now = Date.now();
    return questions.slice().sort(function (a, b) {
      var sa = st.srs[a.id], sb = st.srs[b.id];
      var pa = scorePriority(sa, now);
      var pb = scorePriority(sb, now);
      return pb - pa;
    });
  }

  function scorePriority(rec, now) {
    if (!rec) return 50; /* Unseen card */
    var overdue = rec.nextReviewAt <= now;
    if (rec.rating === 'again') return overdue ? 120 : 95;
    if (rec.rating === 'hard') return overdue ? 105 : 75;
    if (overdue) return 85;
    if (rec.rating === 'good') return 25;
    return 10; /* easy & not due */
  }

  function getDueCount(questions) {
    var st = window.MSHUB_STORAGE.load();
    var now = Date.now();
    return questions.filter(function (q) {
      var r = st.srs[q.id];
      return !r || r.nextReviewAt <= now || r.rating === 'again' || r.rating === 'hard';
    }).length;
  }

  return {
    rate: rate,
    getOrderedQueue: getOrderedQueue,
    getDueCount: getDueCount
  };
})();

/* ==========================================================================
   M<>S Study Hub — Flashcards & Active Recall (js/flashcards.js)
   Integrated with Spaced Repetition (Again / Hard / Good / Easy).
   ========================================================================== */

window.MSHUB_FLASHCARDS = (function () {
  var queue = [];
  var revealed = false;

  function refresh() {
    queue = window.MSHUB_SRS.getOrderedQueue(window.MSHUB_DATA.questions);
    revealed = false;
  }

  function ensure() { if (!queue.length) refresh(); }

  return {
    getState: function () {
      ensure();
      return {
        current: queue[0] || null,
        dueCount: window.MSHUB_SRS.getDueCount(window.MSHUB_DATA.questions),
        total: queue.length,
        revealed: revealed
      };
    },
    reveal: function () { revealed = !revealed; },
    rateCurrent: function (rating) {
      ensure();
      if (!queue[0]) return;
      window.MSHUB_SRS.rate(queue[0].id, rating);
      refresh();
    }
  };
})();

/* ==========================================================================
   M<>S Study Hub — Instant-Feedback Quiz Engine (js/quiz.js)
   NO Submit button: immediate evaluation on click for MCQ, T/F, & Matching;
   randomized option positions preserving exact correct mapping.
   ========================================================================== */

window.MSHUB_QUIZ = (function () {
  var sess = null;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function shuffleOptions(q) {
    if ((q.type === 'mcq' || q.type === 'matching') && q.opts && q.opts.length > 2) {
      var idxed = q.opts.map(function (o, i) { return { o: o, ok: i === q.correct }; });
      var sh = shuffle(idxed);
      return Object.assign({}, q, {
        opts: sh.map(function (x) { return x.o; }),
        correct: sh.findIndex(function (x) { return x.ok; })
      });
    }
    return Object.assign({}, q);
  }

  function norm(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,;:!?]+$/g, ''); }

  function start(cfg) {
    if (cfg.type === 'matching') {
      var sets = cfg.topic && cfg.topic !== 'all'
        ? window.MSHUB_DATA.matchingSets.filter(function (s) { return s.topicId === cfg.topic; })
        : window.MSHUB_DATA.matchingSets;
      sess = {
        mode: 'matching', cfg: cfg,
        boards: sets.map(function (s) {
          return {
            topicId: s.topicId,
            terms: s.pairs.slice(),
            defs: shuffle(s.pairs.slice()),
            pickedTerm: null,
            matched: {}, /* termId -> true */
            lastErr: null,
            mistakes: 0
          };
        }),
        boardIdx: 0, score: 0, total: sets.reduce(function (acc, s) { return acc + s.pairs.length; }, 0),
        wrongIds: [], finished: false
      };
      return sess;
    }

    var pool = window.MSHUB_DATA.questions.filter(function (q) {
      if (cfg.onlyIds) return cfg.onlyIds.indexOf(q.id) !== -1;
      if (cfg.topic && cfg.topic !== 'all' && q.topicId !== cfg.topic) return false;
      if (cfg.type && cfg.type !== 'all' && q.type !== cfg.type) return false;
      return true;
    });
    if (!pool.length) return null;

    var ordered = cfg.shuffled !== false ? shuffle(pool) : pool.slice();
    var chosen = ordered.slice(0, Math.min(cfg.count || 10, ordered.length)).map(shuffleOptions);
    sess = {
      mode: 'standard', cfg: cfg, questions: chosen, index: 0,
      locked: {}, score: 0, wrongIds: [], finished: false
    };
    return sess;
  }

  /* Immediate evaluation on MCQ / T/F click */
  function selectOption(optIdx) {
    if (!sess || sess.mode !== 'standard' || sess.finished) return null;
    var q = sess.questions[sess.index];
    if (!q || sess.locked[q.id]) return null;
    var ok = Number(optIdx) === Number(q.correct);
    sess.locked[q.id] = { picked: Number(optIdx), ok: ok };
    if (ok) sess.score += 1; else sess.wrongIds.push(q.id);
    window.MSHUB_STORAGE.recordAnswer(q.id, ok, q.opts[optIdx]);
    return sess.locked[q.id];
  }

  /* Immediate evaluation on Fill check */
  function checkFill(val) {
    if (!sess || sess.mode !== 'standard' || sess.finished) return null;
    var q = sess.questions[sess.index];
    if (!q || sess.locked[q.id]) return null;
    var ok = (q.ans || []).some(function (a) { return norm(a) === norm(val); });
    sess.locked[q.id] = { typed: val, ok: ok };
    if (ok) sess.score += 1; else sess.wrongIds.push(q.id);
    window.MSHUB_STORAGE.recordAnswer(q.id, ok, val || '—');
    return sess.locked[q.id];
  }

  /* Immediate evaluation on Matching pair click */
  function matchDefClick(defId) {
    if (!sess || sess.mode !== 'matching') return null;
    var b = sess.boards[sess.boardIdx];
    if (!b || !b.pickedTerm || b.matched[b.pickedTerm]) return null;
    var ok = b.pickedTerm === defId;
    var termObj = b.terms.find(function (t) { return t.id === b.pickedTerm; });
    var defObj = b.defs.find(function (d) { return d.id === defId; });
    if (ok) {
      b.matched[b.pickedTerm] = true;
      b.lastErr = null;
      sess.score += 1;
      window.MSHUB_STORAGE.recordAnswer('match-' + b.pickedTerm, true, defObj.def);
    } else {
      b.mistakes += 1;
      b.lastErr = { term: termObj.term, def: defObj.def };
      if (sess.wrongIds.indexOf('match-' + b.pickedTerm) === -1) sess.wrongIds.push('match-' + b.pickedTerm);
      window.MSHUB_STORAGE.recordAnswer('match-' + b.pickedTerm, false, defObj.def);
    }
    b.pickedTerm = null;
    return ok;
  }

  function next() {
    if (!sess) return;
    if (sess.mode === 'matching') {
      if (sess.boardIdx < sess.boards.length - 1) sess.boardIdx += 1;
      else finish();
      return;
    }
    if (sess.index < sess.questions.length - 1) sess.index += 1;
    else finish();
  }

  function finish() {
    if (!sess || sess.finished) return;
    sess.finished = true;
    var tot = sess.mode === 'matching' ? sess.total : sess.questions.length;
    var pct = tot ? Math.round((sess.score / tot) * 100) : 0;
    window.MSHUB_STORAGE.update(function (st) {
      st.quizHistory.unshift({ ts: Date.now(), score: sess.score, total: tot, pct: pct });
    });
  }

  return {
    shuffleOptions: shuffleOptions,
    start: start, selectOption: selectOption, checkFill: checkFill, matchDefClick: matchDefClick,
    next: next, getSession: function () { return sess; }, clear: function () { sess = null; }
  };
})();

/* ==========================================================================
   M<>S Study Hub — Real Progress Analytics (js/progress.js)
   ========================================================================== */

window.MSHUB_PROGRESS = (function () {
  function compute() {
    var st = window.MSHUB_STORAGE.load();
    var qs = window.MSHUB_DATA.questions;
    var answeredUnique = 0, correctTotal = 0, wrongTotal = 0;

    qs.forEach(function (q) {
      var s = st.questionStats[q.id];
      if (s && s.attempts > 0) {
        answeredUnique += 1;
        correctTotal += s.correct;
        wrongTotal += s.wrong;
      }
    });

    var totalAttempts = correctTotal + wrongTotal;
    var accuracy = totalAttempts ? Math.round((correctTotal / totalAttempts) * 100) : 0;
    var overallPct = Math.round(((answeredUnique / Math.max(1, qs.length)) * 70) + (((st.completedTopics || []).length / 3) * 30));

    var perTopic = window.MSHUB_DATA.topics.map(function (tp) {
      var tqs = qs.filter(function (q) { return q.topicId === tp.id; });
      var ans = tqs.filter(function (q) { return st.questionStats[q.id] && st.questionStats[q.id].attempts > 0; }).length;
      return {
        topicId: tp.id,
        answered: ans,
        total: tqs.length,
        pct: Math.round((ans / Math.max(1, tqs.length)) * 100),
        completed: (st.completedTopics || []).indexOf(tp.id) !== -1
      };
    });

    var activeMistakes = Object.keys(st.mistakes || {}).filter(function (k) { return !st.mistakes[k].mastered; });

    return {
      totalTopics: 3,
      totalQuestions: qs.length,
      answeredUnique: answeredUnique,
      correctTotal: correctTotal,
      wrongTotal: wrongTotal,
      accuracy: accuracy,
      overallPct: Math.min(100, overallPct),
      streak: st.streak || 0,
      perTopic: perTopic,
      activeMistakes: activeMistakes,
      dueSrs: window.MSHUB_SRS.getDueCount(qs)
    };
  }

  return { compute: compute };
})();

    root.querySelectorAll('[data-srs]').forEach(function (b) { b.addEventListener('click', function () { window.MSHUB_FLASHCARDS.rateCurrent(b.getAttribute('data-srs')); renderPractice(); }); });
    root.querySelectorAll('[data-col-go]').forEach(function (b) {
      b.addEventListener('click', function () {
        window.MSHUB_QUIZ.start({ topic: b.getAttribute('data-ct'), type: b.getAttribute('data-cy'), count: 15, shuffled: true });
        go('quiz');
      });
    });
    var cu = document.getElementById('col-unans');
    if (cu) cu.addEventListener('click', function () {
      var ids = window.MSHUB_DATA.questions.filter(function (q) { return !st.questionStats[q.id]; }).map(function (q) { return q.id; });
      window.MSHUB_QUIZ.start({ onlyIds: ids, count: Math.min(15, ids.length), shuffled: true });
      go('quiz');
    });
  }
  function collCard(title, topic, type) {
    return '<div class="card"><strong>' + esc(title) + '</strong><div style="margin-top:10px;"><button class="btn btn-secondary btn-sm" data-col-go="1" data-ct="' + topic + '" data-cy="' + type + '">Start &rarr;</button></div></div>';
  }

  /* ==================== MY MISTAKES NOTEBOOK ==================== */
  function renderMistakes() {
    var root = document.getElementById('page-mistakes');
    if (!root) return;
    var t = window.MSHUB_I18N.t, lang = window.MSHUB_I18N.getLang(), st = window.MSHUB_STORAGE.load();
    var entries = Object.keys(st.mistakes || {}).map(function (id) {
      var q = window.MSHUB_DATA.questions.find(function (x) { return x.id === id; });
      return q ? Object.assign({ q: q, id: id }, st.mistakes[id]) : null;
    }).filter(function (e) { return e && !e.mastered && (ui.mistakeTopic === 'all' || e.q.topicId === ui.mistakeTopic); });

    root.innerHTML =
      '<div class="page-head"><div class="eyebrow">M&lt;&gt;S · ' + t('navMistakes') + '</div><h1 class="page-title">' + t('mistakesTitle') + '</h1><p class="page-sub">' + t('mistakesSub') + '</p></div>' +
      '<div class="tabs">' +
        ['all', 'topic1', 'topic2', 'topic3'].map(function (tp) {
          return '<button class="tab ' + (ui.mistakeTopic === tp ? 'active' : '') + '" data-mtf="' + tp + '">' + (tp === 'all' ? t('allTopics') : tp.toUpperCase()) + '</button>';
        }).join('') +
        (entries.length ? '<button class="btn btn-accent btn-sm" id="mk-prac" style="margin-inline-start:auto;">' + t('practiceMistakes') + '</button>' : '') +
      '</div>' +
      (entries.length ? entries.map(function (e) {
        return '<div class="card" style="margin-bottom:12px;">' +
          '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;">' +
            '<span class="badge badge-err">' + e.q.topicId.toUpperCase() + ' · ' + t('missedCount') + ': ' + e.wrongCount + 'x</span>' +
            '<div style="display:flex;gap:6px;"><button class="btn btn-primary btn-sm" data-mk-ok="' + e.id + '">' + t('markMastered') + '</button><button class="btn btn-secondary btn-sm" data-mk-del="' + e.id + '">' + t('removeMistake') + '</button></div>' +
          '</div>' +
          '<p style="margin:0 0 6px;font-weight:700;">' + esc(e.q.q) + '</p>' +
          '<div style="font-size:0.86rem;color:var(--err);"><strong>' + t('yourChoice') + ':</strong> ' + esc(e.lastWrong) + '</div>' +
          '<div style="font-size:0.86rem;color:var(--ok);"><strong>' + t('correctChoice') + ':</strong> ' + esc(e.q.type === 'fill' ? e.q.display : e.q.opts[e.q.correct]) + '</div>' +
          '<div style="font-size:0.84rem;color:var(--text-muted);margin-top:4px;">' + esc(lang === 'ar' ? e.q.expAr : e.q.expEn) + '</div>' +
        '</div>';
      }).join('') : '<div class="empty-box">' + t('empty') + '</div>');

    root.querySelectorAll('[data-mtf]').forEach(function (b) { b.addEventListener('click', function () { ui.mistakeTopic = b.getAttribute('data-mtf'); renderMistakes(); }); });
    root.querySelectorAll('[data-mk-ok]').forEach(function (b) { b.addEventListener('click', function () { var id = b.getAttribute('data-mk-ok'); window.MSHUB_STORAGE.update(function (s) { if (s.mistakes[id]) s.mistakes[id].mastered = true; }); renderMistakes(); }); });
    root.querySelectorAll('[data-mk-del]').forEach(function (b) { b.addEventListener('click', function () { var id = b.getAttribute('data-mk-del'); window.MSHUB_STORAGE.update(function (s) { delete s.mistakes[id]; }); renderMistakes(); }); });
    var mp = document.getElementById('mk-prac');
    if (mp) mp.addEventListener('click', function () { window.MSHUB_QUIZ.start({ onlyIds: entries.map(function (e) { return e.id; }), count: entries.length, shuffled: true }); go('quiz'); });
  }

  /* ==================== PROGRESS + JSON EXPORT/IMPORT ==================== */
  function renderProgress() {
    var root = document.getElementById('page-progress');
    if (!root) return;
    var t = window.MSHUB_I18N.t, p = window.MSHUB_PROGRESS.compute();

    root.innerHTML =
      '<div class="page-head"><div class="eyebrow">M&lt;&gt;S · ' + t('navProgress') + '</div><h1 class="page-title">' + t('progressTitle') + '</h1><p class="page-sub">' + t('progressSub') + '</p></div>' +
      '<section class="stats-strip">' +
        '<div class="stat-tile"><div class="stat-k">' + t('overallProg') + '</div><div class="stat-v">' + p.overallPct + '%</div></div>' +
        '<div class="stat-tile"><div class="stat-k">' + t('statAnswered') + '</div><div class="stat-v">' + p.answeredUnique + '/' + p.totalQuestions + '</div></div>' +
        '<div class="stat-tile"><div class="stat-k">' + t('statAccuracy') + '</div><div class="stat-v">' + (p.correctTotal + p.wrongTotal ? p.accuracy + '%' : '—') + '</div></div>' +
        '<div class="stat-tile"><div class="stat-k">' + t('dueNow') + '</div><div class="stat-v">' + p.dueSrs + '</div></div>' +
      '</section>' +
      '<div class="card" style="margin-bottom:18px;">' +
        p.perTopic.map(function (pt, i) {
          return '<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:0.88rem;font-weight:600;margin-bottom:4px;"><span>Topic ' + (i + 1) + '</span><span>' + pt.answered + '/' + pt.total + ' (' + pt.pct + '%)</span></div><div class="progress-track"><div class="progress-fill" style="width:' + pt.pct + '%;"></div></div></div>';
        }).join('') +
      '</div>' +
      '<div class="card" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">' +
        '<button class="btn btn-primary btn-sm" id="btn-exp-json">' + t('exportJson') + '</button>' +
        '<label class="btn btn-secondary btn-sm" for="inp-imp-json" style="cursor:pointer;">' + t('importJson') + '</label>' +
        '<input type="file" id="inp-imp-json" accept=".json,application/json" style="display:none;">' +
        '<button class="btn btn-danger btn-sm" id="btn-rst-open" style="margin-inline-start:auto;">' + t('resetProgress') + '</button>' +
      '</div>';

    document.getElementById('btn-exp-json').addEventListener('click', function () {
      var data = window.MSHUB_STORAGE.exportJson();
      try {
        var blob = new Blob([data], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'ms-study-hub-progress.json';
        a.click();
        toast('Exported progress JSON.');
      } catch (e) { toast('Export ready.'); }
    });
    document.getElementById('inp-imp-json').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var r = window.MSHUB_STORAGE.importJson(reader.result);
        toast(r.ok ? 'Progress imported!' : r.error);
        if (r.ok) render();
      };
      reader.readAsText(file);
    });
    document.getElementById('btn-rst-open').addEventListener('click', function () {
      document.getElementById('reset-modal').classList.add('open');
    });
  }

  function render() {
    syncChrome();
    if (ui.page === 'home') renderHome();
    else if (ui.page === 'study') window.MSHUB_STUDY.render(document.getElementById('page-study'));
    else if (ui.page === 'quiz') renderQuiz();
    else if (ui.page === 'practice') renderPractice();
    else if (ui.page === 'mistakes') renderMistakes();
    else if (ui.page === 'progress') renderProgress();
  }

  function init() {
    var st = window.MSHUB_STORAGE.load();
    window.MSHUB_I18N.apply(st.lang || 'en');
    document.documentElement.setAttribute('data-theme', st.theme || 'light');

    ui.page = document.body.getAttribute('data-page') || 'home';
    var params = new URLSearchParams(window.location.search);
    if (params.get('topic')) window.MSHUB_STUDY.setTopic(params.get('topic'));
    else window.MSHUB_STUDY.setTopic(st.lastTopic || 'topic1');

    document.querySelectorAll('[data-nav]').forEach(function (el) {
      el.addEventListener('click', function (e) { if (isSpa()) { e.preventDefault(); go(el.getAttribute('data-nav')); } });
    });
    var mb = document.getElementById('btn-mobile');
    if (mb) mb.addEventListener('click', function () { document.getElementById('mobile-drawer').classList.toggle('open'); });
    document.getElementById('btn-lang').addEventListener('click', function () { window.MSHUB_I18N.toggle(); render(); });
    document.getElementById('btn-theme').addEventListener('click', function () {
      var nxt = (window.MSHUB_STORAGE.load().theme || 'light') === 'light' ? 'dark' : 'light';
      window.MSHUB_STORAGE.update(function (s) { s.theme = nxt; });
      document.documentElement.setAttribute('data-theme', nxt);
      syncChrome();
    });
    var rc = document.getElementById('rst-cancel');
    if (rc) rc.addEventListener('click', function () { document.getElementById('reset-modal').classList.remove('open'); });
    var rok = document.getElementById('rst-confirm');
    if (rok) rok.addEventListener('click', function () {
      document.getElementById('reset-modal').classList.remove('open');
      window.MSHUB_STORAGE.resetAll();
      window.MSHUB_QUIZ.clear();
      render();
      toast('Progress reset.');
    });

    /* Spacebar flips SRS flashcard */
    document.addEventListener('keydown', function (e) {
      if (ui.page === 'practice' && ui.practiceTab === 'srs' && e.code === 'Space' && !(e.target && e.target.tagName === 'INPUT')) {
        e.preventDefault();
        window.MSHUB_FLASHCARDS.reveal();
        renderPractice();
      }
    });

    render();
  }

  document.addEventListener('DOMContentLoaded', init);
  return { go: go, render: render };
})();

  </script>
</body>
</html>
